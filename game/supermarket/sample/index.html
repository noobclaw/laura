.nav div{position:relative;width:62px;text-align:center;font-size:11.5px;font-weight:700;color:#bdb6ea}
.nav i{display:grid;place-items:center;width:50px;height:50px;margin:0 auto 3px;border-radius:17px;font-style:normal;font-size:24px;background:linear-gradient(#3b3080,#241b58);box-shadow:0 5px 0 #130d36,inset 0 1px 0 rgba(255,255,255,.2)}
