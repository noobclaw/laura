<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<title>Lantern — look and feel target</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Look-and-feel target for the Cocos build. All art is drawn in code here (no image files);
   the lantern, tiles, glow, particles and sounds define the bar the engine version must meet. */
:root{--ink:#fff6e0;--mute:#c3bde6;--gold:#ffcf6b;--gold-d:#b86a14;--blue:#4b55c4;--blue-d:#272a78;--bad:#ff5d6c}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);background:linear-gradient(180deg,#0b1030 0%,#1b1748 55%,#3a2060 100%) fixed;
 font-family:"Baloo Bhaijaan 2",ui-rounded,"SF Pro Rounded","Segoe UI","Noto Sans Arabic",system-ui,sans-serif;font-weight:500;user-select:none;-webkit-user-select:none}
#sky,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:5}
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;
 padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
body[data-screen=home] #home,body[data-screen=game] #game{display:flex}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* home */
#home{justify-content:center;gap:14px;text-align:center}
#hero{width:200px;height:220px}
h1{margin:-8px 0 0;font-size:clamp(56px,18vw,84px);line-height:1;font-weight:800;color:#ffe9b0;
 text-shadow:0 4px 0 #a8551c,0 0 34px rgba(255,170,70,.6)}
#t-rules{margin:0 0 10px;max-width:30ch;color:var(--mute);font-size:17px;line-height:1.4}
.btn{border:0;border-radius:22px;min-height:66px;width:min(100%,320px);padding:6px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
 font-size:24px;font-weight:800;line-height:1.1;color:#4a2408;background:linear-gradient(#ffe38f,#ffb53d);box-shadow:0 6px 0 var(--gold-d),0 16px 26px rgba(0,0,0,.4);transition:transform .06s,box-shadow .06s}
.btn small{font-size:14px;font-weight:700;opacity:.72}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-d),0 8px 14px rgba(0,0,0,.4)}
.btn.alt{color:var(--ink);background:linear-gradient(#6670dc,#4347b0);box-shadow:0 6px 0 var(--blue-d),0 16px 26px rgba(0,0,0,.4)}
.btn.alt:active{box-shadow:0 2px 0 var(--blue-d),0 8px 14px rgba(0,0,0,.4)}
.chips{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.chip{min-height:48px;min-width:48px;padding:0 16px;border-radius:24px;display:inline-flex;align-items:center;gap:8px;color:var(--ink);font-size:16px;font-weight:700;
 background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.24)}
.chip[aria-pressed=false]{opacity:.55}
.chip svg,.tool svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* game */
#game{gap:10px}
.hud{width:min(100%,520px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.hud .chip{justify-self:start;padding:0 12px}
[dir=rtl] #back svg{transform:scaleX(-1)}
#lvl{font-size:24px;font-weight:800;color:#ffe9b0;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#time{justify-self:end;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mute)}
#pips{display:flex;gap:7px;direction:ltr;min-height:16px}
#pips i{width:12px;height:16px;border-radius:45%;background:rgba(255,255,255,.16);transition:background .2s,box-shadow .2s,transform .2s}
#pips i.on{background:linear-gradient(#ffe38f,#ff8a3d);box-shadow:0 0 12px rgba(255,180,80,.9);transform:scale(1.15)}
#pips i.bad{background:var(--bad);box-shadow:0 0 12px rgba(255,93,108,.9)}
.stage{flex:1;display:grid;place-items:center;width:100%}
#board{touch-action:none;filter:drop-shadow(0 18px 28px rgba(0,0,0,.45))}
#msg{min-height:46px;margin:0;max-width:34ch;text-align:center;color:var(--mute);font-size:16px;line-height:1.4}
.tools{display:flex;gap:28px;justify-content:center}
.tool{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:14px;font-weight:700}
.tool span.b{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#6670dc,#4347b0);box-shadow:0 5px 0 var(--blue-d),0 12px 18px rgba(0,0,0,.4);transition:transform .06s,box-shadow .06s}
.tool:active span.b{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-d),0 6px 10px rgba(0,0,0,.4)}
.tool.gold span.b{color:#4a2408;background:linear-gradient(#ffe38f,#ffb53d);box-shadow:0 5px 0 var(--gold-d),0 12px 18px rgba(0,0,0,.4)}
.tool:disabled{opacity:.4}
#hintN{position:absolute;top:-6px;inset-inline-end:-6px;min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;background:#fff;color:#4a2408;font-size:15px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.25)}

/* win sheet */
#win{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
 padding:22px 20px max(26px,env(safe-area-inset-bottom));border-radius:30px 30px 0 0;background:linear-gradient(#3b379a,#211b5c);box-shadow:0 -10px 40px rgba(0,0,0,.5);
 transform:translateY(110%);transition:transform .5s cubic-bezier(.2,1.25,.3,1);visibility:hidden}
#win.on{transform:none;visibility:visible}
#t-win{font-size:40px;font-weight:800;line-height:1;color:#ffe9b0;text-shadow:0 3px 0 #a8551c}
.stars{display:flex;gap:10px;direction:ltr}
.stars svg{width:54px;height:54px;fill:rgba(255,255,255,.14);transform:scale(.6)}
#win.on .stars svg{animation:star .45s cubic-bezier(.2,1.6,.4,1) forwards}
#win.on .stars svg:nth-child(2){animation-delay:.18s}#win.on .stars svg:nth-child(3){animation-delay:.36s}
#win.on .stars svg.got{fill:var(--gold);filter:drop-shadow(0 0 10px rgba(255,190,90,.9))}
@keyframes star{to{transform:scale(1)}}
#winInfo{margin:0 0 6px;color:var(--mute);font-size:17px}
#win .row{display:flex;gap:12px;width:min(100%,360px)}
#win .btn{min-height:60px}
#homeBtn{width:auto;flex:0 0 auto;padding:0 20px}
.pop{position:fixed;z-index:7;pointer-events:none;white-space:nowrap;font-weight:800;font-size:34px;line-height:1;color:#fff;text-shadow:0 3px 0 #b8501c,0 0 20px rgba(255,190,90,.95);animation:pop 1.05s cubic-bezier(.2,1.4,.4,1) forwards}
.pop.big{font-size:60px;color:#ffe9b0;text-shadow:0 5px 0 #a8551c,0 0 40px rgba(255,180,80,.95);animation-duration:1.7s}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-10deg)}16%{opacity:1;transform:translate(-50%,-75%) scale(1.3) rotate(4deg)}32%{transform:translate(-50%,-85%) scale(1) rotate(0)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-170%) scale(.92)}}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,rgba(255,240,200,.9),rgba(255,200,120,.25) 60%,transparent 80%)}
#flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
#board.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-7px) rotate(-.6deg)}40%{transform:translateX(6px) rotate(.5deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#pips i.on{animation:pip .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes pip{0%{transform:scale(.4)}100%{transform:scale(1.15)}}
#win.on #next{animation:beat 1.1s ease-in-out 1.4s infinite}
@keyframes beat{50%{transform:scale(1.05);box-shadow:0 6px 0 var(--gold-d),0 0 34px rgba(255,200,100,.85)}}
@media(prefers-reduced-motion:reduce){.pop,#flash.go,#board.shake,#pips i.on,#win.on #next{animation:none}.pop{display:none}#win,.btn,.tool span.b{transition:none}#win.on .stars svg{animation-duration:.01s}}
</style>
</head>
<body data-screen="home">
<canvas id="sky"></canvas>

<section class="screen" id="home">
  <canvas id="hero" width="400" height="440"></canvas>
  <h1 id="t-title"></h1>
  <p id="t-rules"></p>
  <button class="btn" id="play"><span id="t-play"></span><small id="playSub"></small></button>
  <button class="btn alt" id="daily"><span id="t-daily"></span><small id="dailySub"></small></button>
  <div class="chips">
    <button class="chip" id="lang"></button>
    <button class="chip" id="snd"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg><span id="t-snd"></span></button>
    <button class="chip" id="auto"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span id="t-auto"></span></button>
  </div>
</section>

<section class="screen" id="game">
  <div class="hud">
    <button class="chip" id="back" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="lvl"></div>
    <div id="time">0:00</div>
  </div>
  <div id="pips" aria-hidden="true"></div>
  <div class="stage"><canvas id="board" role="img" aria-label="Puzzle board"></canvas></div>
  <p id="msg" role="status" aria-live="polite"></p>
  <div class="tools">
    <button class="tool" id="undo"><span class="b"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/></svg></span><span id="t-undo"></span></button>
    <button class="tool gold" id="hint"><span class="b"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg><b id="hintN"></b></span><span id="t-hint"></span></button>
    <button class="tool" id="reset"><span class="b"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></span><span id="t-reset"></span></button>
  </div>
</section>

<div id="win" role="dialog" aria-labelledby="t-win">
  <div id="t-win"></div>
  <div class="stars" id="stars">
    <svg viewBox="0 0 24 24"><path d="M12 2l3 6.6 7 .8-5.2 4.8 1.5 7L12 17.6 5.700 21.200l1.500-7L2 9.400l7-.8z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 2l3 6.6 7 .8-5.2 4.8 1.5 7L12 17.6 5.700 21.200l1.500-7L2 9.400l7-.8z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 2l3 6.6 7 .8-5.2 4.8 1.5 7L12 17.6 5.700 21.200l1.500-7L2 9.400l7-.8z"/></svg>
  </div>
  <p id="winInfo"></p>
  <div class="row"><button class="btn alt" id="homeBtn"></button><button class="btn" id="next"></button></div>
</div>
<div id="flash"></div>
<canvas id="fx"></canvas>

<script>
{

const T={
 en:{title:"Lantern",rules:"Light one lantern in every row, column and colour. Lanterns never touch.",play:"Play",daily:"Daily puzzle",level:"Level",undo:"Undo",hint:"Hint",reset:"Restart",auto:"Auto-mark",snd:"Sound",home:"Home",
  how:"Tap once to mark a tile empty, twice to light a lantern. Drag to mark several.",win:"Solved!",next:"Next puzzle",best:"Best",time:"Time",dailyDone:"Come back tomorrow for a new daily puzzle.",streak:"Streak",newToday:"New today",doneToday:"Solved today",

 ar:{title:"فانوس",rules:"أضئ فانوساً واحداً في كل صف وكل عمود وكل لون. الفوانيس لا تتلامس أبداً.",play:"العب",daily:"لغز اليوم",level:"المرحلة",undo:"تراجع",hint:"تلميح",reset:"إعادة",auto:"تعليم تلقائي",snd:"الصوت",home:"الرئيسية",
  how:"اضغط مرة لتعليم الخانة فارغة، ومرتين لإضاءة فانوس. اسحب لتعليم عدة خانات.",win:"تم الحل!",next:"اللغز التالي",best:"الأفضل",time:"الوقت",dailyDone:"عُد غداً للغز يومي جديد.",streak:"السلسلة",newToday:"جديد اليوم",doneToday:"تم حله اليوم",
  hRow:"هذه الخانة في صف فيه فانوس، فتبقى فارغة.",hCol:"هذه الخانة في عمود فيه فانوس، فتبقى فارغة.",hReg:"هذه الخانة بلون فيه فانوس، فتبقى فارغة.",hAdj:"هذه الخانة تلامس فانوساً، فتبقى فارغة.",
  hOnlyRow:"بقيت خانة واحدة متاحة في هذا الصف. الفانوس هنا.",hOnlyCol:"بقيت خانة واحدة متاحة في هذا العمود. الفانوس هنا.",hOnlyReg:"بقيت خانة واحدة متاحة بهذا اللون. الفانوس هنا.",
  praise:["جميل!","رائع!","مذهل!","خرافي!","لا يُوقَف!"],win3:"مثالي!",win2:"أحسنت!",hBad:"هذا الفانوس يخالف القواعد. أزِله.",hWrong:"هذا الفانوس في مكان خاطئ. أزِله.",hGive:"لا توجد خطوة بسيطة. في هذه الخانة فانوس.",noHints:"لا تلميحات متبقية لهذا اللغز.",gen:"جارٍ إنشاء اللغز…"}};
// ---------- storage (optional; the game works without it) ----------
const mem={};
const load=(k,d)=>{try{const v=localStorage.getItem("lantern."+k);return v==null?(k in mem?mem[k]:d):JSON.parse(v)}catch(e){return k in mem?mem[k]:d}};
const save=(k,v)=>{mem[k]=v;try{localStorage.setItem("lantern."+k,JSON.stringify(v))}catch(e){}};
// ---------- generator: unique-solution puzzles from a seed ----------
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nbs(k,n){const y=Math.floor(k/n),x=k%n,o=[];if(y>0)o.push(k-n);if(y<n-1)o.push(k+n);if(x>0)o.push(k-1);if(x<n-1)o.push(k+1);return o}
function perm(n,r){const p=[],used=new Array(n).fill(false);const go=row=>{if(row===n)return true;for(const c of shuffle([...Array(n).keys()],r)){if(used[c])continue;if(row>0&&Math.abs(p[row-1]-c)<2)continue;used[c]=true;p[row]=c;if(go(row+1))return true;used[c]=false}return false};go(0);return p}
function grow(n,p,r){const g=new Array(n*n).fill(-1);for(let i=0;i<n;i++)g[i*n+p[i]]=i;let left=n*n-n;while(left>0){const cand=[];for(let k=0;k<n*n;k++)if(g[k]<0&&nbs(k,n).some(j=>g[j]>=0))cand.push(k);const k=cand[Math.floor(r()*cand.length)];const o=nbs(k,n).filter(j=>g[j]>=0);g[k]=g[o[Math.floor(r()*o.length)]];left--}return g}
function countSolutions(n,g,limit){let cnt=0;const cu=new Array(n).fill(false),ru=new Array(n).fill(false);const go=(row,prev)=>{if(cnt>=limit)return;if(row===n){cnt++;return}for(let c=0;c<n;c++){if(cu[c])continue;if(prev>=0&&Math.abs(prev-c)<2)continue;const rg=g[row*n+c];if(ru[rg])continue;cu[c]=ru[rg]=true;go(row+1,c);cu[c]=ru[rg]=false}};go(0,-1);return cnt}
function makePuzzle(n,seed){const r=rng(seed);for(let t=0;t<20000;t++){const p=perm(n,r);for(let k=0;k<20;k++){const g=grow(n,p,r);if(countSolutions(n,g,2)===1)return{n,g,sol:p}}}return null}
// ---------- state ----------
// tile colours: [top face, side face]
const PAL=[["#35b3a8","#1f7a73"],["#a56bd6","#6f3f9c"],["#ec6f8e","#ab4562"],["#5f86ea","#3a57ad"],["#86bf5c","#557f38"],["#e3bd6a","#a5843c"],["#52bdea","#2f83ad"],["#98a2cc","#5f6896"]];
const S={lang:load("lang","en"),screen:"home",mode:"levels",level:load("level",1),p:null,cells:[],undo:[],hints:3,used:0,t0:0,tick:0,done:false,auto:load("auto",true),sound:load("sound",true),hintCell:-1,at:[],shake:[],gone:new Set(),combo:0,introT:0};
const $=id=>document.getElementById(id), tr=k=>T[S.lang][k];
const dayKey=d=>d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(), todayKey=()=>dayKey(new Date());
const sizeFor=l=>5+Math.min(3,Math.floor((l-1)/5));
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

// ---------- sound: synthesized, no audio files ----------
let AC=null;
function tone(f,d,type="sine",vol=.12,when=0){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SCALE=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5];
// recorded clips (see assets/ASSETS.md); the synth above is the fallback when a clip is missing
const EXT=(()=>{try{return new Audio().canPlayType("audio/ogg; codecs=vorbis")?"ogg":"mp3"}catch(e){return"mp3"}})();
const CLIP={};for(const n of["place","mark","tap","bad","lift","hint","rise","win"]){try{const a=new Audio("assets/sfx/"+n+"."+EXT);a.preload="auto";a.addEventListener("canplaythrough",()=>{CLIP[n]=a},{once:true})}catch(e){}}
function clip(n,vol=1,rate=1){if(!S.sound)return true;const src=CLIP[n];if(!src)return false;try{const a=src.cloneNode();a.volume=vol;a.preservesPitch=false;a.playbackRate=rate;const pr=a.play();pr&&pr.catch(()=>{});return true}catch(e){return false}}
const sfx={place:i=>{if(!clip("place",.9,SCALE[i%8]/SCALE[0]))tone(SCALE[i%8],.5,"triangle",.16);tone(SCALE[i%8]*2,.35,"sine",.05,.02)},
 mark:()=>{clip("mark",.6)||tone(1400,.05,"sine",.04)},lift:()=>{clip("lift",.7)||tone(330,.14,"sine",.08)},bad:()=>{clip("bad",.8)||tone(140,.24,"sine",.1)},
 tap:()=>{clip("tap",.6)||tone(700,.06,"triangle",.06)},hint:()=>{clip("hint",.7)||tone(990,.2,"sine",.08)},rise:i=>{clip("rise",.3,1+i*.07)||tone(SCALE[i%8]*2,.4,"sine",.05)},
 win:()=>{if(!clip("win",.9))[0,2,4,5,7].forEach((n,i)=>tone(SCALE[n],.7,"triangle",.14,i*.1))}};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
// ---------- rules ----------
function conflicts(){const n=S.p.n,g=S.p.g,bad=new Set(),L=[];S.cells.forEach((v,k)=>{if(v===2)L.push(k)});
 for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const a=L[i],b=L[j],ay=Math.floor(a/n),ax=a%n,by=Math.floor(b/n),bx=b%n;
  if(ay===by||ax===bx||g[a]===g[b]||(Math.abs(ay-by)<2&&Math.abs(ax-bx)<2)){bad.add(a);bad.add(b)}}
 return{bad,count:L.length}}
function blockedBy(k){const n=S.p.n,g=S.p.g,y=Math.floor(k/n),x=k%n;for(let j=0;j<n*n;j++){if(S.cells[j]!==2||j===k)continue;const jy=Math.floor(j/n),jx=j%n;
  if(jy===y)return"hRow";if(jx===x)return"hCol";if(g[j]===g[k])return"hReg";if(Math.abs(jy-y)<2&&Math.abs(jx-x)<2)return"hAdj"}return null}
function findHint(){const n=S.p.n,g=S.p.g,{bad}=conflicts();
 for(const k of bad)return{k,why:"hBad"};

 else{save("level",S.level+1);$("next").style.display="";say("")}
 [...$("stars").children].forEach((s,i)=>s.classList.toggle("got",i<got));$("winInfo").textContent=info;$("t-win").textContent=tr(got===3?"win3":got===2?"win2":"win");
 const sheetAt=calm?300:350+n*130+900;
 if(!calm){const lk=S.undo.length?S.undo[S.undo.length-1][0]:0,bb=cv.getBoundingClientRect();flash();waves.push({x:(n-1)/2,y:(n-1)/2,t0:performance.now()+80,sp:7,amp:1.25,max:99});waves.push({x:(n-1)/2,y:(n-1)/2,t0:performance.now()+620,sp:7,amp:.7,max:99});
  setTimeout(()=>praise(VW/2,bb.top+bb.height*.45,tr(got===3?"win3":got===2?"win2":"win"),true),250);
  for(let j=0;j<7;j++)setTimeout(()=>{if(S.done)firework(VW*(.15+Math.random()*.7),VH*(.1+Math.random()*.32),FW[j%5])},500+j*330+Math.random()*120);
  for(let j=0;j<got;j++)setTimeout(()=>{if(!S.done)return;const b=$("stars").children[j].getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/2,22,"255,215,120",220);rings.push({x:b.left+b.width/2,y:b.top+b.height/2,age:0,life:.45,r0:16,r1:70,rgb:"255,225,150"});clip("rise",.6,1+j*.2)||tone(SCALE[j*2+3],.3,"triangle",.12);buzz(18)},sheetAt+420+j*180)}
 // release every lantern into the sky, then show the result sheet
 const now=performance.now();let i=0;S.cells.forEach((v,k)=>{if(v!==2)return;const p=cellPage(k);floaters.push({k,i,x:p.x,y:p.y,h:p.cs*.78,v:70+Math.random()*40,born:now+350+i*130,live:false});i++});
 setTimeout(()=>sfx.win(),350);if(!calm)for(let j=0;j<34;j++)sparks.push({x:Math.random()*VW,y:-20,vx:(Math.random()-.5)*40,vy:120+Math.random()*160,g:40,age:-(.6+n*.13+Math.random()*1.2),life:2.6,size:14+Math.random()*18,rot:Math.random()*6,spin:(Math.random()-.5)*5,tex:"symbol_02",col:j%3?"255,207,107":"255,255,255"});buzz([30,60,30,60,60]);pips();setTimeout(()=>{if(S.done)$("win").classList.add("on")},sheetAt)}
function start(){clearInterval(S.tick);$("win").classList.remove("on");floaters.length=0;S.p=null;show("game");say(tr("gen"));
 setTimeout(()=>{const n=S.mode==="daily"?7:sizeFor(S.level),seed=S.mode==="daily"?todayKey():S.level*7919+n;
  S.p=makePuzzle(n,seed);S.cells=new Array(n*n).fill(0);S.undo=[];S.at=[];S.shake=[];S.gone=new Set();S.hints=3;S.used=0;S.done=false;S.hintCell=-1;S.combo=0;S.introT=performance.now()+60;waves.length=beams.length=0;S.t0=Date.now();
  S.tick=setInterval(()=>{$("time").textContent=fmt(Math.round((Date.now()-S.t0)/1000))},500);$("time").textContent="0:00";
  layout();text();pips();say(tr("how"));window.__lantern=S},30)}
// ---------- input ----------
function cellAt(e){if(!S.p)return-1;const b=cv.getBoundingClientRect(),{P,cs}=geo(),x=Math.floor((e.clientX-b.left-P)/cs),y=Math.floor((e.clientY-b.top-P)/cs),n=S.p.n;return x<0||y<0||x>=n||y>=n?-1:y*n+x}
let drag=null;
cv.addEventListener("pointerdown",e=>{const k=cellAt(e);if(k<0)return;drag={k,moved:false};cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{if(!drag)return;const k=cellAt(e);if(k<0)return;if(k!==drag.k||drag.moved){if(!drag.moved){drag.moved=true;if(S.cells[drag.k]===0)setCell(drag.k,1)}if(S.cells[k]===0)setCell(k,1)}});
cv.addEventListener("pointerup",()=>{if(drag&&!drag.moved)setCell(drag.k,(S.cells[drag.k]+1)%3);drag=null});
cv.addEventListener("pointercancel",()=>{drag=null});
$("undo").onclick=()=>{if(S.done)return;sfx.tap();S.combo=0;let u=S.undo.pop();while(u){S.cells[u[0]]=u[1];S.at[u[0]]=performance.now();if(!u[2])break;u=S.undo.pop()}S.hintCell=-1;pips()};
$("reset").onclick=()=>{if(S.done)return;sfx.tap();S.combo=0;S.cells.fill(0);S.undo=[];S.hintCell=-1;pips()};
$("hint").onclick=()=>{if(S.done)return;if(S.hints<=0){say(tr("noHints"));return}const h=findHint();if(!h)return;sfx.hint();S.hints--;S.used++;if(h.why==="hGive")setCell(h.k,2);S.hintCell=h.k;say(tr(h.why));text()};
$("next").onclick=()=>{S.level=load("level",S.level+1);start()};
$("homeBtn").onclick=$("back").onclick=()=>{sfx.tap();clearInterval(S.tick);$("win").classList.remove("on");floaters.length=0;S.level=load("level",S.level);show("home")};
$("play").onclick=()=>{sfx.tap();S.mode="levels";S.level=load("level",1);start()};
$("daily").onclick=()=>{sfx.tap();S.mode="daily";start()};
$("lang").onclick=()=>{S.lang=S.lang==="en"?"ar":"en";save("lang",S.lang);text()};
$("snd").onclick=()=>{S.sound=!S.sound;save("sound",S.sound);text();sfx.tap()};
$("auto").onclick=()=>{S.auto=!S.auto;save("auto",S.auto);text();sfx.tap()};
addEventListener("resize",layout);
window.__lanternApi={start,setCell,show};
layout();text();requestAnimationFrame(frame);
}
