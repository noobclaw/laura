# Project configuration (layout follows Donchitos/Claude-Code-Game-Studios, MIT)
schema_version: 1
project:
  name: "貓躲狗找 (working title)"
  stage: pre-production        # see production/stage.txt and production/gate-checks/
engine:
  name: "Web"
  renderer: "three.js (WebGL2), vendored, version pinned in web/vendor"
  shell: "Electron for Windows/macOS Steam builds (ADR-0001)"
