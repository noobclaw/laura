name: daycount
description: "Offline countdown & anniversary tracker with a home-screen widget."
publish_to: 'none'

version: 1.1.3+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Locale-aware Material/Cupertino widgets (date pickers etc.); our own
  # strings are localized inline via core/l10n.dart `tr()`.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Local storage of the event list as a JSON file in the app sandbox.
  path_provider: ^2.1.6
  # Android home-screen widget bridge (pushes the featured countdown to the
  # native AppWidgetProvider). No network — writes shared prefs the widget reads.
  home_widget: ^0.7.0
  # Play Billing / StoreKit for the single `pro_unlock` non-consumable. Billing
  # runs inside the store app's process, so this needs no INTERNET permission.
  in_app_purchase: ^3.2.0
  # Native store-rating prompt (core/review_prompt.dart): fires after the
  # third completed core action, at most once per 90 days; the OS decides
  # whether to show anything. No network of our own.
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Lets review_prompt_test.dart point the JSON store at a temp directory.
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
