name: ohmbench
description: "OhmBench: an offline, touch-first circuit simulator with an MNA solver and a live scope."
publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # StoreKit / Play Billing for the one Pro unlock. Billing runs in the
  # store's process, so the app needs no network permission of its own.
  in_app_purchase: ^3.2.0
  # The app's private support folder for circuits.json and friends.
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/MartianMono-OFL.txt
  fonts:
    - family: MartianMono
      fonts:
        - asset: assets/fonts/MartianMono-Regular.ttf
        - asset: assets/fonts/MartianMono-Bold.ttf
          weight: 700
