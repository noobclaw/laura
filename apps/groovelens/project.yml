name: Groovelens
options:
  bundleIdPrefix: com.noobclaw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    ENABLE_PREVIEWS: "YES"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
targets:
  Groovelens:
    type: application
    platform: iOS
    sources:
      - path: Groovelens
        excludes:
          - "**/*.storekit"
          - "**/OFL-*.txt"
      - path: Groovelens/Resources/Fonts/OFL-Unbounded.txt
        buildPhase: resources
      - path: Groovelens/Resources/Fonts/OFL-ChakraPetch.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noobclaw.groovelens
        PRODUCT_NAME: Groovelens
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Groovelens/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
  GroovelensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GroovelensTests
    dependencies:
      - target: Groovelens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noobclaw.groovelens.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Groovelens.app/Groovelens"
        BUNDLE_LOADER: "$(TEST_HOST)"
  GroovelensUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GroovelensUITests
    dependencies:
      - target: Groovelens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noobclaw.groovelens.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Groovelens
schemes:
  GroovelensUITour:
    build:
      targets:
        Groovelens: all
        GroovelensUITests: [test]
    test:
      config: Debug
      targets:
        - GroovelensUITests
  Groovelens:
    build:
      targets:
        Groovelens: all
        GroovelensTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Groovelens/Store/Groovelens.storekit
    test:
      config: Debug
      targets:
        - GroovelensTests
    archive:
      config: Release
