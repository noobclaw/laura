name: Spindle
options:
  bundleIdPrefix: com.noobclaw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    ENABLE_PREVIEWS: "YES"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
targets:
  Spindle:
    type: application
    platform: iOS
    sources:
      - path: Spindle
        excludes:
          - "**/*.storekit"
          - "**/OFL-*.txt"
      - path: Spindle/Resources/Fonts/OFL-Anton.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noobclaw.spindle
        PRODUCT_NAME: Spindle
        # Device family must be set on the target: XcodeGen's target default (1,2) overrides the project level.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Spindle/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
  SpindleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpindleTests
    dependencies:
      - target: Spindle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noobclaw.spindle.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Spindle.app/Spindle"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SpindleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpindleUITests
    dependencies:
      - target: Spindle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noobclaw.spindle.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Spindle
schemes:
  SpindleUITour:
    build:
      targets:
        Spindle: all
        SpindleUITests: [test]
    test:
      config: Debug
      targets:
        - SpindleUITests
  Spindle:
    build:
      targets:
        Spindle: all
        SpindleTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Spindle/Store/Spindle.storekit
    test:
      config: Debug
      targets:
        - SpindleTests
    archive:
      config: Release
