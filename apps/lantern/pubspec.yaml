name: lantern
description: "Lantern: a lantern logic puzzle. The game itself is the web build in assets/game, shown in a full-screen WebView."
publish_to: 'none'

version: 0.4.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # The whole game runs as local files inside this view. No network access is used.
  webview_flutter: ^4.10.0
  # StoreKit / Play Billing for the two consumable item packs. Goes through the store's own process.
  in_app_purchase: ^3.2.0
  # Native copy of the item counts, so paid items survive the web view's storage being cleared.
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Flutter asset folders are not recursive: every folder is listed.
  assets:
    - assets/game/
    - assets/game/vendor/
    - assets/game/assets/
    - assets/game/assets/fx/
