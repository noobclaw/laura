name: lantern
description: "Lantern: a lantern logic puzzle. The game itself is the web build in assets/game, shown in a full-screen WebView."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # The whole game runs as local files inside this view. No network access is used.
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Flutter asset folders are not recursive: every folder is listed.
  assets:
    - assets/game/
    - assets/game/vendor/
    - assets/game/assets/fx/
    - assets/game/assets/sfx/
