name: Accord
options:
  bundleIdPrefix: com.noobclaw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    ENABLE_PREVIEWS: "YES"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
targets:
  Accord:
    type: application
    platform: iOS
    sources:
      - path: Accord
        excludes:
          - "**/*.storekit"
          - "**/OFL-*.txt"
      - path: Accord/Resources/Fonts/OFL-BodoniModa.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noobclaw.accord
        PRODUCT_NAME: Accord
        # Device family must be set on the target: XcodeGen's target default (1,2) overrides the project level.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Accord/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
  AccordTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AccordTests
    dependencies:
      - target: Accord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noobclaw.accord.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Accord.app/Accord"
        BUNDLE_LOADER: "$(TEST_HOST)"
  AccordUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AccordUITests
    dependencies:
      - target: Accord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noobclaw.accord.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Accord
schemes:
  AccordUITour:
    build:
      targets:
        Accord: all
        AccordUITests: [test]
    test:
      config: Debug
      targets:
        - AccordUITests
  Accord:
    build:
      targets:
        Accord: all
        AccordTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Accord/Store/Accord.storekit
    test:
      config: Debug
      targets:
        - AccordTests
    archive:
      config: Release
