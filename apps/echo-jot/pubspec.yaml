name: echo_jot
description: "Offline voice notes — dictated by the system's on-device recognizer."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Locale-aware Material/Cupertino widgets; our own strings are localized
  # inline via core/l10n.dart `tr()`.
  flutter_localizations:
    sdk: flutter
  # Play Billing / StoreKit for the single Pro unlock (core/purchase.dart).
  # Billing goes through the store app's process — no INTERNET permission
  # needed, so the zero-network claim holds.
  in_app_purchase: ^3.2.0
  # Explicit runtime permission flow for the microphone (grant / denied /
  # permanently-denied → open settings).
  permission_handler: ^11.3.1
  # Notes live in a single JSON file in the app sandbox.
  path_provider: ^2.1.6
  # System share sheet for text export (no INTERNET permission).
  share_plus: ^13.2.0

  # NB: transcription needs NO package at all — it goes through the system's
  # on-device SpeechRecognizer via android/.../DictationBridge.kt. That replaced
  # whisper_flutter_new, which downloaded its weights at runtime and therefore
  # could never honour the zero-network promise.

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

# path_provider (via path_provider_android) pulls in the native `jni` package.
# jni 1.0.1's android/build.gradle is incompatible with our AGP 9 / Gradle 9
# toolchain (`Could not find method kotlin()`), while 1.0.0 builds cleanly — the
# version the other factory apps ship.
dependency_overrides:
  jni: 1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
