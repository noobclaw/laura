<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0407A"/>
      <stop offset="0.55" stop-color="#8E1F4C"/>
      <stop offset="1" stop-color="#3A0F22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.24" r="0.45">
      <stop offset="0" stop-color="#FFC857" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFC857" stop-opacity="0"/>
