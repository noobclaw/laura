<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#8E24AA"/>
      <stop offset="0.55" stop-color="#4A148C"/>
      <stop offset="1" stop-color="#14091C"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD166" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FFD166" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonFill" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFE59A"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="white"/>
      <!-- the bite: a second disc offset up-right -->
      <circle cx="628" cy="310" r="236" fill="black"/>
    </mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- faint stars -->
  <g fill="#FFFFFF" fill-opacity="0.55">
    <circle cx="176" cy="196" r="7"/>
    <circle cx="842" cy="150" r="5"/>
    <circle cx="300" cy="112" r="4"/>
    <circle cx="892" cy="612" r="6"/>
    <circle cx="120" cy="560" r="4"/>
  </g>
  <!-- moon glow -->
  <circle cx="500" cy="380" r="380" fill="url(#moonGlow)"/>
  <!-- crescent: full disc minus an offset disc -->
  <g mask="url(#crescent)">
    <circle cx="500" cy="380" r="292" fill="url(#moonFill)"/>
  </g>
  <!-- waveform shadow, then the waveform -->
  <g filter="url(#soft)" transform="translate(0 12)" opacity="0.4"><line x1="110" y1="760" x2="946" y2="760" stroke="#14091C" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/><rect x="133" y="750" width="34" height="20" rx="17" fill="#14091C"/><rect x="187" y="738" width="34" height="44" rx="17" fill="#14091C"/><rect x="241" y="714" width="34" height="92" rx="17" fill="#14091C"/><rect x="295" y="730" width="34" height="60" rx="17" fill="#14091C"/><rect x="349" y="685" width="34" height="150" rx="17" fill="#14091C"/><rect x="403" y="718" width="34" height="84" rx="17" fill="#14091C"/><rect x="457" y="662" width="34" height="196" rx="17" fill="#14091C"/><rect x="511" y="705" width="34" height="110" rx="17" fill="#14091C"/><rect x="565" y="642" width="34" height="236" rx="17" fill="#14091C"/><rect x="619" y="695" width="34" height="130" rx="17" fill="#14091C"/><rect x="673" y="672" width="34" height="176" rx="17" fill="#14091C"/><rect x="727" y="725" width="34" height="70" rx="17" fill="#14091C"/><rect x="781" y="701" width="34" height="118" rx="17" fill="#14091C"/><rect x="835" y="736" width="34" height="48" rx="17" fill="#14091C"/><rect x="889" y="747" width="34" height="26" rx="17" fill="#14091C"/></g>
  <line x1="110" y1="760" x2="946" y2="760" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/><rect x="133" y="750" width="34" height="20" rx="17" fill="#FFFFFF"/><rect x="187" y="738" width="34" height="44" rx="17" fill="#FFFFFF"/><rect x="241" y="714" width="34" height="92" rx="17" fill="#FFFFFF"/><rect x="295" y="730" width="34" height="60" rx="17" fill="#FFFFFF"/><rect x="349" y="685" width="34" height="150" rx="17" fill="#FFFFFF"/><rect x="403" y="718" width="34" height="84" rx="17" fill="#FFFFFF"/><rect x="457" y="662" width="34" height="196" rx="17" fill="#FFFFFF"/><rect x="511" y="705" width="34" height="110" rx="17" fill="#FFFFFF"/><rect x="565" y="642" width="34" height="236" rx="17" fill="#FFFFFF"/><rect x="619" y="695" width="34" height="130" rx="17" fill="#FFFFFF"/><rect x="673" y="672" width="34" height="176" rx="17" fill="#FFFFFF"/><rect x="727" y="725" width="34" height="70" rx="17" fill="#FFFFFF"/><rect x="781" y="701" width="34" height="118" rx="17" fill="#FFFFFF"/><rect x="835" y="736" width="34" height="48" rx="17" fill="#FFFFFF"/><rect x="889" y="747" width="34" height="26" rx="17" fill="#FFFFFF"/>
</svg>