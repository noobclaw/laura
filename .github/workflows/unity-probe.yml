name: Unity probe

# Feasibility check: can a Unity 6 project be built for iOS entirely in CI?
on:
  push:
    branches: [game/plan-and-first-prototype]
    paths:
      - 'game/supermarket/unity-probe/**'
      - '.github/workflows/unity-probe.yml'

jobs:
  unity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the editor image is over 8 GB)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /
          free -g

      - name: Check licence secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          for v in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::warning::secret $v is not set"; else echo "$v is set"; fi
          done

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: game/supermarket/unity-probe
          targetPlatform: iOS
          unityVersion: 6000.0.23f1
          buildMethod: CiBuild.IOS
          allowDirtyBuild: true

      - name: Show output
        if: always()
        run: |
          df -h /
          sudo du -sh build 2>/dev/null || true
          sudo find build -maxdepth 3 | head -40 || true

      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS
          retention-days: 3

  xcode:
    needs: unity
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: xc

      - name: Compile for device, unsigned
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          PROJ=$(find xc -name '*.xcodeproj' -maxdepth 3 | head -1)
          echo "Project: $PROJ"
          # artifacts drop the executable bit
          find "$(dirname "$PROJ")" -name '*.sh' -exec chmod +x {} +
          find "$(dirname "$PROJ")" -type f \( -name 'MapFileParser' -o -name 'il2cpp*' -o -name 'usymtool*' \) -exec chmod +x {} + || true
          xcodebuild -project "$PROJ" -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -40
