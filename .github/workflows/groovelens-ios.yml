name: Groovelens iOS

on:
  workflow_dispatch:
  push:
    branches: [app/groovelens]
    paths:
      - 'apps/groovelens/**'
      - '.github/workflows/groovelens-ios.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/groovelens
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate

      - name: Build and test on the simulator
        run: |
          mkdir -p ci-out
          SIM=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-7]( Pro)? \(' | head -1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "SIM=$SIM" >> $GITHUB_ENV
          set +e
          xcodebuild -project Groovelens.xcodeproj -scheme Groovelens -destination "id=$SIM" \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO test > ci-out/build.log 2>&1
          echo $? > ci-out/status.txt
          grep -E 'error:|warning: .*(deprecated|will never be executed)|Test Case .*(passed|failed)|\*\* (TEST|BUILD) ' ci-out/build.log | sort -u | head -300 > ci-out/summary.txt
          tail -80 ci-out/build.log > ci-out/tail.txt
          exit 0

      - name: Export localizations
        run: |
          set +e
          xcodebuild -exportLocalizations -project Groovelens.xcodeproj -localizationPath ci-out/loc -exportLanguage en > ci-out/loc.log 2>&1
          XLIFF=$(find ci-out/loc -name 'en.xliff' | head -1)
          [ -n "$XLIFF" ] && cp "$XLIFF" ci-out/en.xliff
          rm -rf ci-out/loc
          # Localization gate: every exported key translated in all 9 target languages.
          python3 scripts/check_strings.py ci-out/en.xliff Groovelens/Resources > ci-out/l10n.txt 2>&1
          echo $? > ci-out/l10n-status.txt
          cat ci-out/l10n.txt | head -20
          exit 0

      - name: Launch and screenshot
        run: |
          APP=$(find dd/Build/Products -name 'Groovelens.app' -path '*iphonesimulator*' | head -1)
          if [ -z "$APP" ]; then echo "no app"; exit 0; fi
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl install "$SIM" "$APP"
          xcrun simctl launch "$SIM" com.noobclaw.groovelens
          sleep 6
          xcrun simctl io "$SIM" screenshot ci-out/home.png
          for L in zh-Hant ja de; do
            xcrun simctl terminate "$SIM" com.noobclaw.groovelens || true
            xcrun simctl launch "$SIM" com.noobclaw.groovelens -AppleLanguages "($L)"
            sleep 5
            xcrun simctl io "$SIM" screenshot "ci-out/home-$L.png"
          done
          xcrun simctl spawn "$SIM" log show --last 1m --predicate 'process == "Groovelens"' --style compact | tail -60 > ci-out/runtime.log || true

      - name: Publish results to the groovelens-ci branch
        if: always()
        run: |
          cd ci-out
          echo "${{ github.sha }}" > commit.txt
          git init -q && git checkout -q -b groovelens-ci
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "ci for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" groovelens-ci

      - name: Fail if the build, tests or localization gate failed
        run: |
          test "$(cat ci-out/status.txt)" = "0"
          test "$(cat ci-out/l10n-status.txt)" = "0"

  testflight:
    needs: build
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[testflight]')
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/groovelens
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate

      - name: Prepare signing
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          P12_B64: ${{ secrets.IOS_DEV_CERT_P12 }}
          P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$P12_B64" ]; then echo "signing secrets missing" >&2; exit 1; fi
          mkdir -p ~/asc ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/asc/AuthKey.p8
          cp ~/asc/AuthKey.p8 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "$P12_B64" | base64 -d > ~/asc/dev.p12
          security create-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p ci build.keychain
          security import ~/asc/dev.p12 -k build.keychain -P "$P12_PASS" -A -f pkcs12
          security list-keychains -d user -s build.keychain login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain >/dev/null

      - name: App Store Connect setup (app record check, in-app purchase)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          mkdir -p ci-tf
          set +e
          ASC_KEY_PATH=~/asc/AuthKey.p8 python3 scripts/asc_setup.py 2>&1 | tee ci-tf/asc.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ $rc -ne 0 ]; then echo FAIL > ci-tf/status.txt; exit 1; fi

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          mkdir -p ci-tf
          set -o pipefail
          BUILD=$(( 100 + ${{ github.run_number }} ))
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          xcodebuild -project Groovelens.xcodeproj -scheme Groovelens -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Groovelens.xcarchive archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=$BUILD \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/asc/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > ci-tf/archive.log 2>&1 || { grep -E 'error:' ci-tf/archive.log | head -40; tail -40 ci-tf/archive.log; exit 1; }
          tail -5 ci-tf/archive.log

      - name: Export signed IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Groovelens.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/asc/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > ci-tf/export.log 2>&1 || { tail -40 ci-tf/export.log; exit 1; }
          ls -la build/ipa/

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          IPA=$(ls build/ipa/*.ipa | head -1)
          # altool can exit 0 while printing an ERROR, so judge its output
          set +e
          out=$(xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1)
          rc=$?
          set -e
          echo "$out" | tee ci-tf/upload.log
          echo "build $BUILD" > ci-tf/build.txt
          if [ $rc -ne 0 ] || echo "$out" | grep -q "ERROR"; then echo FAIL > ci-tf/status.txt; else echo OK > ci-tf/status.txt; fi

      - name: Publish TestFlight log
        if: always()
        run: |
          mkdir -p ci-tf && cd ci-tf
          [ -f status.txt ] || echo FAIL > status.txt
          echo "${{ github.sha }}" > commit.txt
          git init -q && git checkout -q -b groovelens-tf
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "testflight for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" groovelens-tf
          test "$(cat status.txt)" = OK
