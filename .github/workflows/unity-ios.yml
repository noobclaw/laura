name: Unity iOS

# Builds the Unity project in the cloud: Linux exports the Xcode project, macOS compiles it.
on:
  push:
    branches: [game/plan-and-first-prototype]
    paths:
      - 'game/supermarket/unity/**'
      - '.github/workflows/unity-ios.yml'

env:
  PROJECT: game/supermarket/unity

jobs:
  unity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT }}/Library
          key: unity-library-ios-${{ hashFiles('game/supermarket/unity/Packages/manifest.json', 'game/supermarket/unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: unity-library-ios-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT }}
          targetPlatform: iOS
          unityVersion: 6000.0.23f1
          buildMethod: CiBuild.IOS
          allowDirtyBuild: true
          customParameters: -buildNumber ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS
          retention-days: 3

  xcode:
    needs: unity
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: xc

      - name: Compile for device, unsigned
        run: |
          set -o pipefail
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          PROJ=$(find xc -name '*.xcodeproj' -maxdepth 3 | head -1)
          echo "Project: $PROJ"
          # artifacts drop the executable bit
          find "$(dirname "$PROJ")" -name '*.sh' -exec chmod +x {} +
          find "$(dirname "$PROJ")" -type f \( -name 'MapFileParser' -o -name 'il2cpp*' -o -name 'usymtool*' \) -exec chmod +x {} + || true
          xcodebuild -project "$PROJ" -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -40
