name: Unity iOS

# Builds the Unity project in the cloud: Linux exports the Xcode project, macOS compiles it.
on:
  push:
    branches: [game/plan-and-first-prototype]
    paths:
      - 'game/supermarket/unity/**'
      - '.github/workflows/unity-ios.yml'

env:
  PROJECT: game/supermarket/unity

jobs:
  unity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT }}/Library
          key: unity-library-ios-${{ hashFiles('game/supermarket/unity/Packages/manifest.json', 'game/supermarket/unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: unity-library-ios-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT }}
          targetPlatform: iOS
          unityVersion: 6000.0.23f1
          buildMethod: CiBuild.IOS
          allowDirtyBuild: true
          customParameters: -buildNumber ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS
          retention-days: 3

  xcode:
    needs: unity
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: xc

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Prepare signing
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          P12_B64: ${{ secrets.IOS_DEV_CERT_P12 }}
          P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$P12_B64" ]; then echo "signing secrets missing" >&2; exit 1; fi
          mkdir -p ~/asc
          printf '%s' "$ASC_KEY_P8" > ~/asc/AuthKey.p8
          echo "$P12_B64" | base64 -d > ~/asc/dev.p12
          security create-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p ci build.keychain
          security import ~/asc/dev.p12 -k build.keychain -P "$P12_PASS" -A -f pkcs12
          security list-keychains -d user -s build.keychain login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain >/dev/null

      - name: Archive (cloud signing via ASC API key)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -o pipefail
          PROJ=$(find xc -name '*.xcodeproj' -maxdepth 3 | head -1)
          DIR=$(dirname "$PROJ")
          echo "Project: $PROJ"
          # artifacts drop the executable bit
          find "$DIR" -name '*.sh' -exec chmod +x {} +
          find "$DIR" -type f \( -name 'MapFileParser' -o -name 'il2cpp*' -o -name 'usymtool*' \) -exec chmod +x {} + || true
          # the game uses no encryption beyond what the OS provides
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$DIR/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$DIR/Info.plist"
          xcodebuild -project "$PROJ" -scheme Unity-iPhone -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Souq.xcarchive archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/asc/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40

      - name: Export signed IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Souq.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/asc/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/ipa/

      - uses: actions/upload-artifact@v4
        with:
          name: souq-ipa
          path: build/ipa/*.ipa
          retention-days: 7

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          IPA=$(ls build/ipa/*.ipa | head -1)
          mkdir -p ~/.appstoreconnect/private_keys
          cp ~/asc/AuthKey.p8 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # altool can exit 0 while printing an ERROR, so judge its output
          set +e
          out=$(xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ] || echo "$out" | grep -q "ERROR:"; then exit 1; fi
