name: Build App

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App directory to build (e.g. shell, apps/echo-jot)'
        required: true
        default: 'shell'

jobs:
  build-android:
    runs-on: ubuntu-latest
    # Fail fast on hangs (a stuck R8 once ate the full 6h default).
    timeout-minutes: 30
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    defaults:
      run:
        working-directory: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute artifact slug
        id: slug
        working-directory: .
        run: echo "slug=$(echo '${{ inputs.app }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secret — building with debug signing."
            exit 0
          fi
          # Decode tolerantly: if the secret is not valid base64 (or empty once
          # decoded), fall back to debug signing instead of failing the build.
          # Debug-signed APKs still install for acceptance testing; a real
          # release keystore can be added later for Play uploads.
          if echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks 2>/dev/null && [ -s android/upload-keystore.jks ]; then
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
            echo "Release keystore configured."
          else
            echo "Keystore secret is not valid base64 — falling back to debug signing."
            rm -f android/upload-keystore.jks android/key.properties
          fi

      - name: Accept Android SDK licenses
        working-directory: .
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare assets
        run: |
          if [ -f prepare_assets.sh ]; then bash prepare_assets.sh; fi

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --release

      - run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.slug.outputs.slug }}-apk
          path: ${{ inputs.app }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.slug.outputs.slug }}-aab
          path: ${{ inputs.app }}/build/app/outputs/bundle/release/app-release.aab

  # Machine acceptance gate: boot an Android emulator, install the freshly
  # built APK, launch it, and fail the run if the app crashes on startup.
  # `flutter analyze` + `flutter test` prove the code compiles and the logic is
  # right — this proves the APK actually runs on a device. A screenshot of the
  # home screen is uploaded so a human can eyeball that real UI rendered.
  smoke-test:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Checked out only to read the app's applicationId from its Gradle file —
      # deterministic, unlike hunting for aapt on the runner image.
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-android.outputs.slug }}-apk

      - name: Resolve package id
        id: pkg
        run: |
          PKG=$(grep -oE 'applicationId *= *"[^"]+"' '${{ inputs.app }}/android/app/build.gradle.kts' | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$PKG" ]; then
            echo "::error::Could not resolve applicationId from ${{ inputs.app }}/android/app/build.gradle.kts"
            exit 1
          fi
          echo "Package: $PKG"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install and launch the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # NB: this action runs each script line as a separate `sh -c`, so all
          # real logic lives in scripts/ci_smoke.sh — keep this a single line.
          script: bash scripts/ci_smoke.sh '${{ steps.pkg.outputs.pkg }}'

      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ needs.build-android.outputs.slug }}-smoke
          path: smoke-home.png
          if-no-files-found: ignore
