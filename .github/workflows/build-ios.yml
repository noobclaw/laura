name: Build iOS

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App directory to build (e.g. apps/remcard)'
        required: true
        default: 'apps/remcard'
      upload:
        description: 'Upload to TestFlight after building'
        type: boolean
        default: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute artifact slug
        id: slug
        working-directory: .
        run: echo "slug=$(echo '${{ inputs.app }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Select newest Xcode (Apple requires the iOS 26 SDK for uploads)
        working-directory: .
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Write App Store Connect API key
        working-directory: .
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "ASC_API_KEY_P8 secret missing — cannot sign or upload." >&2
            exit 1
          fi
          mkdir -p ~/asc
          printf '%s' "$ASC_KEY_P8" > ~/asc/AuthKey.p8

      - name: Import persistent signing certificate
        working-directory: .
        env:
          P12_B64: ${{ secrets.IOS_DEV_CERT_P12 }}
          P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          # Reuse one Apple Development cert across runs; without this, cloud
          # signing mints a new cert per ephemeral runner until the account cap.
          if [ -z "$P12_B64" ]; then echo "IOS_DEV_CERT_P12 missing"; exit 1; fi
          echo "$P12_B64" | base64 -d > ~/asc/dev.p12
          security create-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p ci build.keychain
          security import ~/asc/dev.p12 -k build.keychain -P "$P12_PASS" -A -f pkcs12
          security list-keychains -d user -s build.keychain login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain >/dev/null
          security find-identity -v build.keychain

      - name: Flutter configure (no compile)
        run: |
          # Build-time inputs that are not in git (e.g. echo-jot's Whisper model).
          if [ -f prepare_assets.sh ]; then bash prepare_assets.sh; fi
          # Native frameworks fetched at build time (e.g. photolift's ncnn).
          if [ -f scripts/fetch_ncnn_ios.sh ]; then bash scripts/fetch_ncnn_ios.sh; fi
          flutter pub get
          # Unique ascending build number per CI run; TestFlight rejects reuse.
          flutter build ios --config-only --release --no-codesign --build-number=${{ github.run_number }}

      - name: Archive (cloud signing via ASC API key)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          # permission_handler compiles each iOS permission behind a macro that
          # defaults to OFF. Plugins link through Swift Package Manager here
          # (no Podfile), and the plugin's Package.swift turns a macro on when
          # the app's Info.plist carries the matching usage key — so every app
          # gets exactly the handlers it declares. Do NOT set PERMISSION_* env
          # here: a global value compiles that handler into every app and
          # Apple then rejects the upload (ITMS-90683, purpose string missing
          # for an API the app never uses).
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/asc/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export signed IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/asc/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/ipa/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.slug.outputs.slug }}-ipa
          path: ${{ inputs.app }}/build/ipa/*.ipa

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          IPA=$(ls build/ipa/*.ipa | head -1)
          # altool looks for the key under ~/.appstoreconnect/private_keys/AuthKey_<ID>.p8
          mkdir -p ~/.appstoreconnect/private_keys
          cp ~/asc/AuthKey.p8 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # altool exits 0 even when it prints an ERROR (e.g. no App Store
          # Connect record for the bundle id), which let a failed upload show
          # as a green step. Capture its output and judge that instead.
          set +e
          out=$(xcrun altool --upload-app -f "$IPA" -t ios \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ] || echo "$out" | grep -q "ERROR:"; then
            echo "altool failed — falling back to fastlane pilot"
            node -e '
              const fs = require("fs"), os = require("os");
              fs.writeFileSync(os.homedir() + "/asc/key.json", JSON.stringify({
                key_id: process.env.ASC_KEY_ID,
                issuer_id: process.env.ASC_ISSUER_ID,
                key: fs.readFileSync(os.homedir() + "/asc/AuthKey.p8", "utf8"),
                in_house: false,
              }));
            '
            fastlane pilot upload --ipa "$IPA" \
              --api_key_path ~/asc/key.json \
              --skip_waiting_for_build_processing true
          fi
